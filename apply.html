<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お申し込み｜はなゆみLP制作サービス</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="eyebrow">制作のご依頼</span>
  <span class="pub">はなゆみLP制作サービス</span>
</header>
<main class="article apply">
  <div class="hero">
    <p class="count">制作のご依頼</p>
    <h1>お申し込み</h1>
    <p class="lead">ご入力いただいた内容を確認のうえ、はなゆみからご連絡します。</p>
  </div>
  <form class="form" id="apply-form" novalidate>
    <fieldset class="field">
      <legend>ご希望のプラン<span class="req">必須</span></legend>
      <div class="choices"><label class="choice">
          <input type="radio" name="plan" value="trial" required>
          <span class="choice-body">
            <span class="choice-name">お試しプラン</span>
            <span class="choice-meta">AIによるLP制作 ／ 19,800円（税込）</span>
          </span>
        </label><label class="choice">
          <input type="radio" name="plan" value="lp" required>
          <span class="choice-body">
            <span class="choice-name">LP制作プラン</span>
            <span class="choice-meta">人の手によるLP制作 ／ 120,000円（税込）</span>
          </span>
        </label></div>
      <p class="err" data-for="plan">プランを1つお選びください。</p>
      <p class="hint"><a class="inline-link" href="plan.html">プランの違いを見る</a></p>
    </fieldset>

    <div class="field">
      <label for="f-name">お名前<span class="req">必須</span></label>
      <input id="f-name" name="name" type="text" autocomplete="name" placeholder="例：山田 花子" required>
      <p class="err" data-for="name">お名前を入力してください。</p>
    </div>
    <div class="field">
      <label for="f-company">屋号・会社名<span class="opt">任意</span></label>
      <input id="f-company" name="company" type="text" autocomplete="organization">
    </div>
    <div class="field">
      <label for="f-email">メールアドレス<span class="req">必須</span></label>
      <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="例：hanako@example.com" required>
      <p class="err" data-for="email">メールアドレスを「name@example.com」の形で入力してください。</p>
    </div>
    <div class="field">
      <label for="f-business">LPで紹介したい商品・サービス<span class="req">必須</span></label>
      <input id="f-business" name="business" type="text" placeholder="例：まつげパーマ専門サロンの初回メニュー" required>
      <p class="err" data-for="business">商品・サービスを入力してください。</p>
    </div>
    <div class="field">
      <label for="f-url">今お使いのサイト・SNSのURL<span class="opt">任意</span></label>
      <input id="f-url" name="url" type="url" inputmode="url" placeholder="https://">
    </div>
    <div class="field">
      <label for="f-when">公開したい時期<span class="opt">任意</span></label>
      <select id="f-when" name="when">
        <option value="">選択してください</option>
        <option>1か月以内</option>
        <option>2〜3か月以内</option>
        <option>時期は決まっていない</option>
      </select>
    </div>
    <div class="field">
      <label for="f-message">ご相談内容<span class="opt">任意</span></label>
      <textarea id="f-message" name="message" rows="5" placeholder="例：広告を始める前にLPを用意したい、どちらのプランが合うか相談したい など"></textarea>
    </div>
    <div class="field agree">
      <label class="check"><input type="checkbox" name="agree" required><span>入力した内容を、ご連絡とご提案のために使うことに同意します</span></label>
      <p class="err" data-for="agree">同意のチェックを入れてください。</p>
    </div>

    <button class="submit" type="submit">この内容で申し込む</button>
    <p class="notice" id="form-notice" role="status" hidden>現在、お申し込みフォームは準備中のため送信できません。お手数ですが、LINEからご連絡ください。</p>
  </form>
  <nav class="pager single"><a class="prev" href="plan.html"><span>戻る</span>プランを選び直す</a></nav>
</main>
<script>
(function () {
  var form = document.getElementById("apply-form");
  var plan = new URLSearchParams(location.search).get("plan");
  var radio = plan && form.querySelector('input[name="plan"][value="' + plan.replace(/[^a-z]/g, "") + '"]');
  if (radio) radio.checked = true;

  function valid(name) {
    var els = form.elements[name];
    if (els instanceof RadioNodeList) return Array.prototype.some.call(els, function (e) { return e.checked; });
    return els.type === "checkbox" ? els.checked : els.checkValidity() && els.value.trim() !== "";
  }
  function show(name) {
    var ok = valid(name);
    var err = form.querySelector('.err[data-for="' + name + '"]');
    err.classList.toggle("is-shown", !ok);
    var el = form.elements[name];
    if (!(el instanceof RadioNodeList)) el.setAttribute("aria-invalid", ok ? "false" : "true");
    return ok;
  }
  var required = ["plan", "name", "email", "business", "agree"];
  required.forEach(function (n) {
    var el = form.elements[n];
    (el instanceof RadioNodeList ? Array.prototype.slice.call(el) : [el]).forEach(function (e) {
      e.addEventListener(e.type === "radio" || e.type === "checkbox" ? "change" : "blur", function () { show(n); });
    });
  });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var bad = required.filter(function (n) { return !show(n); });
    if (bad.length) {
      var first = form.elements[bad[0]];
      (first instanceof RadioNodeList ? first[0] : first).focus();
      return;
    }
    // 送信先は未接続（見た目のみ）。接続時はここで送信処理を行う
    var note = document.getElementById("form-notice");
    note.hidden = false;
    note.scrollIntoView({ block: "nearest" });
  });
})();
</script>
<footer class="foot">
  <p>はなゆみLP制作サービス ｜ はなゆみ式リサーチ手法とは？</p>
</footer>
</body>
</html>
